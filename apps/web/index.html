<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeutschWelt Academy — German Fluency & Coaching Platform</title>
    <meta name="description" content="State-of-the-art German language learning and academic coaching from A1 to B2. Master grammar, vocabulary, speaking, and Goethe/Telc certification." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 font-sans antialiased min-h-screen selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #030712; color: #F8FAFC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 24px;">
          <!-- Modern German Tricolor Crest -->
          <div style="width: 44px; height: 44px; border-radius: 14px; background: #0B1325; border: 1px solid rgba(255,255,255,0.12); padding: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -6px rgba(59, 130, 246, 0.35);">
            <div style="width: 100%; height: 100%; border-radius: 9px; overflow: hidden; display: flex; flex-direction: column;">
              <div style="flex: 1; background-color: #000000;"></div>
              <div style="flex: 1; background-color: #E11D48;"></div>
              <div style="flex: 1; background-color: #F59E0B;"></div>
            </div>
          </div>
          <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: #FFFFFF;">
            <span>Deutsch</span><span style="background: linear-gradient(135deg, #60A5FA, #3B82F6, #93C5FD); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welt</span>
          </div>
        </div>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(59, 130, 246, 0.15); border-top-color: #3B82F6; border-radius: 50%; animation: dw-spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;"></div>
        <p style="margin-top: 18px; font-size: 12px; font-weight: 700; color: #64748B; letter-spacing: 1px; text-transform: uppercase;">DeutschWelt Platform wird geladen...</p>
      </div>
      <style>
        @keyframes dw-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
