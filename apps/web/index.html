<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeutschWelt Coaching — Your Journey to German Fluency</title>
    <meta name="description" content="Premium German language learning and coaching platform from A1 to B2. Master grammar, vocabulary, speaking, reading, and exam preparation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-dark font-sans antialiased min-h-screen selection:bg-mint selection:text-forest-950">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <img src="/logo-transparent.png" alt="DeutschWelt Coaching" style="height: 52px; width: auto; object-fit: contain;" />
        </div>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(20, 78, 61, 0.2); border-top-color: #144E3D; border-radius: 50%; animation: dw-spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #687386;">Laden...</p>
      </div>
      <style>
        @keyframes dw-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
