<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeutschWelt Coaching — Your Journey to German Fluency</title>
    <meta name="description" content="Premium German language learning and coaching platform from A1 to B2. Master grammar, vocabulary, speaking, reading, and exam preparation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0D17] text-slate-100 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0A0D17; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #11162B; border: 1px solid rgba(255,255,255,0.1); padding: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);">
            <div style="width: 100%; height: 100%; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;">
              <div style="flex: 1; background-color: #000000;"></div>
              <div style="flex: 1; background-color: #E11D48;"></div>
              <div style="flex: 1; background-color: #FBBF24;"></div>
            </div>
          </div>
          <div style="font-size: 22px; font-weight: 900; letter-spacing: -0.5px; color: #FFFFFF;">
            <span>Deutsch</span><span style="background: linear-gradient(135deg, #818CF8, #C084FC, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welt</span>
          </div>
        </div>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(99, 102, 241, 0.15); border-top-color: #6366F1; border-radius: 50%; animation: dw-spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 13px; font-weight: 600; color: #94A3B8; letter-spacing: 0.5px;">DeutschWelt wird geladen...</p>
      </div>
      <style>
        @keyframes dw-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
