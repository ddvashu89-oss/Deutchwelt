<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeutschWelt — Your Journey to German Fluency</title>
    <meta name="description" content="Premium German language learning and coaching platform from A1 to B2. Master grammar, vocabulary, speaking, reading, and exam preparation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-ivory text-dark font-sans antialiased min-h-screen selection:bg-germanRed selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F5F1E8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background-color: #17243A; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 900; font-size: 16px; letter-spacing: -0.5px;">DW</div>
          <span style="font-size: 26px; font-weight: 800; color: #17243A; letter-spacing: -0.5px;">Deutsch<span style="color: #D94747;">Welt</span></span>
        </div>
        <div style="width: 32px; height: 32px; border: 3px solid #17243A; border-top-color: #D94747; border-radius: 50%; animation: dw-spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #687386;">Laden...</p>
      </div>
      <style>
        @keyframes dw-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
