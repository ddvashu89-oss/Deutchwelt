services:
  mysql:
    image: mysql:8.4
    container_name: deutschwelt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_USER: deutschwelt
      MYSQL_PASSWORD: deutschwelt_pass
      MYSQL_DATABASE: deutschwelt
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
